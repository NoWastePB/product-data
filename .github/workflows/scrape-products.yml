name: Scrape retailer products

on:
workflow_dispatch:
schedule:
- cron: "0 4 * * *"

permissions:
contents: read

jobs:
scrape:
runs-on: ubuntu-latest
timeout-minutes: 120

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
      cache: pip

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install aiohttp beautifulsoup4 lxml

  - name: Run retailer scraper
    run: |
      python scrapers/main.py

  - name: Upload product data
    uses: actions/upload-artifact@v4
    with:
      name: retailer-product-data-${{ github.run_number }}
      path: |
        aldi.json
        aldi.csv
        jumbo.json
        jumbo.csv
        action.json
        action.csv
        kruidvat.json
        kruidvat.csv
      if-no-files-found: warn
      retention-days: 30
```
