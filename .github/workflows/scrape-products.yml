name: Scrape retailer products

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ------------------------------------------------------
      # Repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4 lxml

      # ------------------------------------------------------
      # Create data directory
      # ------------------------------------------------------

      - name: Create data directory
        run: |
          mkdir -p data

      # ------------------------------------------------------
      # Run scraper
      # ------------------------------------------------------

      - name: Run retailer scraper
        run: |
          python scrapers/main.py

      # ------------------------------------------------------
      # Check generated files
      # ------------------------------------------------------

      - name: Check generated data
        run: |
          echo "Generated files:"
          ls -lh data/

          echo ""
          echo "Product counts:"

          python - <<'PY'
          import json
          from pathlib import Path

          for file in sorted(Path("data").glob("*.json")):
              try:
                  data = json.loads(file.read_text(encoding="utf-8"))

                  if isinstance(data, list):
                      count = len(data)
                  elif isinstance(data, dict) and "products" in data:
                      count = len(data["products"])
                  else:
                      count = "unknown"

                  print(f"{file}: {count}")

              except Exception as e:
                  print(f"{file}: ERROR - {e}")
          PY

      # ------------------------------------------------------
      # Commit changes
      # ------------------------------------------------------

      - name: Commit product data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update retailer product data"
            git push
          fi

      # ------------------------------------------------------
      # Upload artifact as backup
      # ------------------------------------------------------

      - name: Upload product data
        uses: actions/upload-artifact@v4
        with:
          name: retailer-product-data-${{ github.run_number }}
          path: data/
          if-no-files-found: error
          retention-days: 30